<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hardword</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="appContent" class="popup" style="display: none">
      <!-- Header -->
      <header class="header">
        <div class="brand">
          <span class="brand-name">Hardword</span>
        </div>
        <div class="status-badge" id="swStatusBadge">
          <span class="status-dot" id="swStatusDot"></span>
          <span class="status-text" id="swStatusText">Inactive</span>
        </div>
      </header>

      <!-- Toggle Options -->
      <section class="options-group">
        <div class="option-item">
          <div class="option-meta">
            <span class="option-label">Formal</span>
            <span class="option-desc">Professional, academic tone</span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="optFormal" />
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="option-item">
          <div class="option-meta">
            <span class="option-label">Simple</span>
            <span class="option-desc">Everyday plain explanations</span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="optSimple" />
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="option-item">
          <div class="option-meta">
            <span class="option-label">Storage</span>
            <span class="option-desc">Save history of explained words</span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="optStorage" />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </section>

      <!-- Footer -->
      <footer class="footer">
        <span id="versionDisplay">v0.0.1</span>
      </footer>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
